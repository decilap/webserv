<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Webserv 42 - File Upload</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 50px;
    }
    .upload-form {
      background-color: #2d2d2d;
      border-radius: 10px;
      padding: 30px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
      background-color: #3d3d3d;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      width: 100%;
    }
    input[type="submit"] {
      background-color: #4CAF50;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    input[type="submit"]:hover {
      background-color: #45a049;
    }
    .info {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Hello from Webserv 42!</h1>
  <div class="upload-form">
    <h2>Upload a File</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" id="fileInput" required />
      <br>
      <input type="submit" value="Upload File">
    </form>
    <div class="info">
      <p>Selected file will be uploaded to www/upload/</p>
    </div>
  </div>
</body>
</html>
